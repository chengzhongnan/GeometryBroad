<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Drawing</title>
    <style>
        body, html {
            margin: 0;
            padding: 10px;
            height: 100%;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            display: flex;
            flex-direction: column;
        }
        .main-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            flex-grow: 1;
            height: calc(100% - 40px);
        }
        
        .drawing-area {
            flex: 7; /* 画布区域占据7份空间 */
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .output-panel {
            flex: 3; /* 输出面板占据3份空间 */
            border: 1px solid var(--vscode-editorWidget-border, #ccc);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            background-color: var(--vscode-sideBar-background);
        }

        canvas {
            border: 1px solid var(--vscode-editorWidget-border, #ccc);
            display: block; /* 移除默认的 inline-block 间隙 */
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--vscode-editorWidget-border, #ccc);
        }
        .output-header h3 {
            margin: 0;
            font-weight: 600;
        }
        #clear-button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: 1px solid var(--vscode-button-border, transparent);
            padding: 4px 14px;
            border-radius: 2px;
            cursor: pointer;
        }
        #clear-button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }
        .message-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
            font-family: var(--vscode-editor-font-family, 'Courier New', Courier, monospace);
            font-size: var(--vscode-editor-font-size, 13px);
        }
        .message {
            white-space: pre-wrap;
            padding-bottom: 4px;
        }
        .message.error { color: var(--vscode-errorForeground, #F44747); }
        .message.info { color: var(--vscode-descriptionForeground, #717171); }
        .message.warn { color: var(--vscode-list-warningForeground, #CCA700); }
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--vscode-sideBar-background);
            border: 1px solid var(--vscode-editorWidget-border, #ccc);
            border-radius: 4px;
            padding: 8px;
            z-index: 10;
        }
        .controls button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: 1px solid var(--vscode-button-border, transparent);
            padding: 4px 8px;
            border-radius: 2px;
            cursor: pointer;
            margin: 2px;
        }
        .controls button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }
    </style>
</head>
<body>
    <h1>几何画板</h1>
    <div class="main-container">
        <div class="drawing-area">
            <div class="controls">
                <button id="reset-view">重置视图</button>
                <span>缩放: <span id="zoom-level">100%</span></span>
            </div>
            <canvas id="drawingCanvas" width="800" height="800"></canvas>
        </div>
        <div class="output-panel">
            <div class="output-header">
                <h3>信息输出</h3>
                <button id="clear-button">清空</button>
            </div>
            <div id="message-container" class="message-container"></div>
        </div>
    </div>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
    <script nonce="{{nonce}}">
        (function() {
            const canvas = document.getElementById('drawingCanvas');
            const messageContainer = document.getElementById('message-container');
            const clearButton = document.getElementById('clear-button');
            const resetViewButton = document.getElementById('reset-view');
            const zoomLevelSpan = document.getElementById('zoom-level');
            const vscode = acquireVsCodeApi();

            // Canvas 变换状态
            let transform = {
                x: 0,
                y: 0,
                scale: 1
            };

            // 拖动状态
            let isDragging = false;
            let lastMouseX = 0;
            let lastMouseY = 0;

            // 获取Canvas上下文
            const ctx = canvas.getContext('2d');
            
            // 保存原始的绘图函数
            let originalInterpreter = null;
            let currentScript = '';

            // 应用变换到绘图上下文
            function applyTransform() {
                ctx.setTransform(transform.scale, 0, 0, transform.scale, transform.x, transform.y);
            }

            // 重绘Canvas
            function redraw() {
                // 清空Message
                clearMessage();

                // 清空整个Canvas
                ctx.setTransform(1, 0, 0, 1, 0, 0); // 重置变换
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 应用变换
                applyTransform();
                
                // 重新执行绘图脚本
                if (originalInterpreter && currentScript) {
                    originalInterpreter.setTransform(canvas, transform);
                    originalInterpreter.execute(currentScript);
                }
            }

            // 更新缩放显示
            function updateZoomDisplay() {
                zoomLevelSpan.textContent = Math.round(transform.scale * 100) + '%';
            }

            // 鼠标按下事件
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) { // 左键
                    isDragging = true;
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                    canvas.style.cursor = 'grabbing';
                }
            });

            // 鼠标移动事件
            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - lastMouseX;
                    const deltaY = e.clientY - lastMouseY;
                    
                    transform.x += deltaX;
                    transform.y += deltaY;
                    
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                    
                    redraw();
                }
            });

            // 鼠标抬起事件
            canvas.addEventListener('mouseup', (e) => {
                if (e.button === 0) { // 左键
                    isDragging = false;
                    canvas.style.cursor = 'grab';
                }
            });

            // 鼠标离开Canvas区域
            canvas.addEventListener('mouseleave', () => {
                isDragging = false;
                canvas.style.cursor = 'grab';
            });

            // 滚轮缩放事件
            canvas.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) { // Ctrl键或Cmd键
                    e.preventDefault();
                    
                    const rect = canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    
                    // 计算缩放因子
                    const scaleFactor = e.deltaY < 0 ? 1.1 : 0.9;
                    const newScale = Math.max(0.1, Math.min(5, transform.scale * scaleFactor));
                    
                    // 计算缩放中心
                    const scaleChange = newScale / transform.scale;
                    transform.x = mouseX - (mouseX - transform.x) * scaleChange;
                    transform.y = mouseY - (mouseY - transform.y) * scaleChange;
                    transform.scale = newScale;
                    
                    updateZoomDisplay();
                    redraw();
                }
            });

            // 重置视图
            resetViewButton.addEventListener('click', () => {
                transform = { x: 0, y: 0, scale: 1 };
                updateZoomDisplay();
                redraw();
            });

            const clearMessage = () => {
                messageContainer.innerHTML = '';
            }

            // 清空消息
            clearButton.addEventListener('click', () => {
                clearMessage();
            });

            // 消息回调
            const onMessageCallback = (level, line, msg) => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${level.toLowerCase()}`;
                messageElement.textContent = `[Line ${line}] ${level.toUpperCase()}: ${msg}`;
                messageContainer.appendChild(messageElement);
                messageContainer.scrollTop = messageContainer.scrollHeight;
            };

            // 接收VSCode消息
            window.addEventListener('message', event => {
                const message = event.data;
                if (message.command === 'executeScript') {
                    currentScript = message.script;
                    
                    // 创建解释器时传入带变换的canvas上下文
                    originalInterpreter = new GeometryInterpreterLib.GeometryDSLInterpreter(canvas, onMessageCallback);
                    
                    // 执行绘图（会自动应用当前变换）
                    redraw();
                }
            });

            // 初始化
            updateZoomDisplay();
            vscode.postMessage({ command: 'ready' });
        }());
    </script>
</body>
</html>
